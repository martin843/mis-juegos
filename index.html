<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERA-WORLD 3D | Élite</title>
    <style>
        body { margin: 0; background: #050a10; overflow: hidden; font-family: sans-serif; }
        #hud { position: absolute; top: 20px; left: 20px; color: #00f2ff; text-shadow: 0 0 10px #00f2ff; pointer-events: none; z-index: 10; }
        .controles { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .btn-v { width: 75px; height: 75px; background: rgba(0, 242, 255, 0.1); border: 2px solid #00f2ff; color: #fff; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="hud">
        <h2>PROYECTO VERA: EXPLORACIÓN 3D</h2>
        <p>Sincronía: Activa | Ética de Hierro: Cargada</p>
    </div>

    <div class="controles">
        <button class="btn-v" onmousedown="mover('W')" ontouchstart="mover('W')">AVANZAR</button>
        <button class="btn-v" onmousedown="mover('S')" ontouchstart="mover('S')">ATRÁS</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a10);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.PointLight(0x00f2ff, 1.5, 100);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x112233));

        const grid = new THREE.GridHelper(200, 50, 0x00f2ff, 0x002244);
        scene.add(grid);

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        for(let i = 0; i < 15; i++) {
            const mat = new THREE.MeshStandardMaterial({ color: 0x00f2ff, emissive: 0x004466, wireframe: true });
            const cube = new THREE.Mesh(geometry, mat);
            cube.position.set(Math.random()*40-20, 0.5, Math.random()*40-20);
            scene.add(cube);
        }

        camera.position.set(0, 1.6, 5);

        function mover(dir) {
            if(dir === 'W') camera.position.z -= 0.6;
            if(dir === 'S') camera.position.z += 0.6;
        }

        function animate() {
            requestAnimationFrame(animate);
            scene.children.forEach(obj => { if(obj.type === "Mesh") obj.rotation.y += 0.01; });
            renderer.render(scene, camera);
        }

        window.addEventListener('keydown', (e) => {
            if(e.key.toUpperCase() === 'W') mover('W');
            if(e.key.toUpperCase() === 'S') mover('S');
        });

        animate();
    </script>
</body>
</html>
