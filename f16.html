<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERA | F-16 Tactical Sim</title>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 20px solid rgba(0, 242, 255, 0.1); box-sizing: border-box; pointer-events: none; }
        .data { position: absolute; font-weight: bold; text-shadow: 0 0 10px #00f2ff; }
        #alt { top: 40%; right: 20px; }
        #spd { top: 40%; left: 20px; }
        #radar { bottom: 20px; left: 20px; width: 100px; height: 100px; border: 2px solid #00f2ff; border-radius: 50%; }
        .controls { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 10px; }
        .btn { width: 60px; height: 60px; background: rgba(0, 242, 255, 0.2); border: 1px solid #00f2ff; color: #fff; border-radius: 50%; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="hud">
        <div id="spd" class="data">SPD: <span id="valSpd">0</span> KTS</div>
        <div id="alt" class="data">ALT: <span id="valAlt">0</span> FT</div>
        <div id="radar"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border:2px solid #00f2ff; width:50px; height:50px; border-radius:5px"></div>
    </div>
    <canvas id="skyCanvas"></canvas>

    <div class="controls">
        <button style="grid-area: up;" class="btn" onclick="pitch(1)">↑</button>
        <button style="grid-area: left;" class="btn" onclick="roll(-1)">←</button>
        <button style="grid-area: right;" class="btn" onclick="roll(1)">→</button>
        <button style="grid-area: down;" class="btn" onclick="pitch(-1)">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("skyCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let rollAngle = 0; let horizonY = canvas.height/2;
        let speed = 450; let altitude = 15000;

        function roll(dir) { rollAngle += dir * 0.1; }
        function pitch(dir) { horizonY += dir * 20; altitude += dir * 100; }

        function draw() {
            ctx.resetTransform();
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            // Dibujar Horizonte
            ctx.translate(canvas.width/2, horizonY);
            ctx.rotate(rollAngle);
            ctx.fillStyle = "#001a33"; // Suelo oscuro
            ctx.fillRect(-canvas.width*2, 0, canvas.width*4, canvas.height*2);
            ctx.strokeStyle = "#00f2ff";
            ctx.lineWidth = 2;
            ctx.strokeRect(-canvas.width*2, 0, canvas.width*4, 1);

            document.getElementById("valSpd").innerText = speed;
            document.getElementById("valAlt").innerText = altitude;
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
